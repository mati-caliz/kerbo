# Dependencias del estándar para Rust: vulnerabilidades y crates sin mantenimiento de RustSec,
# licencias aceptables para un producto que se publica y se vende, y sólo crates.io como origen.
# Lo copia quality/sync.sh como deny.toml de cada crate y no se edita en el repo.
[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC-BY-4.0",
  "CC0-1.0",
  "HPND",
  "ISC",
  "MIT",
  "MIT-0",
  "MIT-CMU",
  "MPL-2.0",
  "PSF-2.0",
  "Python-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
