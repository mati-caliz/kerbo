name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: never
  DIST_DIR: dist
  HOMEBREW_TAP: mati-caliz/homebrew-tap
  HOMEBREW_FORMULA: release/homebrew/kerbo.rb
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: El tag coincide con el Cargo.toml
        id: check
        run: |
          version="$(bash release/version.sh)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con la versión ${version} del Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            binary: kerbo
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binary: kerbo
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: kerbo
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: kerbo
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: kerbo.exe
            rustflags: -C target-feature=+crt-static
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary: kerbo.exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: musl
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools
      - name: rustup
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL --proto '=https' --tlsv1.2 -o rustup-init.exe \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            echo "${USERPROFILE}\.cargo\bin" >>"${GITHUB_PATH}"
          fi
      - name: Toolchain
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --target "${TARGET}"
      - name: Compilar
        run: cargo build --release --locked --target "${TARGET}"
      - name: Empaquetar
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: bash release/package.sh "${TARGET}" "${BINARY}" "${DIST_DIR}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kerbo-${{ matrix.target }}
          path: ${{ env.DIST_DIR }}/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kerbo-*
          path: ${{ env.DIST_DIR }}
          merge-multiple: true
      - name: Subir los binarios al release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${DIST_DIR}"/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${DIST_DIR}"/* --verify-tag \
              --title "kerbo ${VERSION}" --generate-notes
          fi
      - name: Fórmula de Homebrew
        run: bash release/homebrew/update-formula.sh "${DIST_DIR}" "${HOMEBREW_FORMULA}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: ${{ env.HOMEBREW_FORMULA }}
          if-no-files-found: error
      - name: Actualizar el tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "::notice::Sin el secreto HOMEBREW_TAP_TOKEN la fórmula queda sólo como artefacto del workflow"
            exit 0
          fi
          tap_dir="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP}.git" "${tap_dir}"
          mkdir -p "${tap_dir}/Formula"
          cp "${HOMEBREW_FORMULA}" "${tap_dir}/Formula/"
          git -C "${tap_dir}" add Formula
          if git -C "${tap_dir}" diff --cached --quiet; then
            echo "::notice::La fórmula del tap ya estaba en ${VERSION}"
            exit 0
          fi
          git -C "${tap_dir}" -c user.name="${BOT_NAME}" -c user.email="${BOT_EMAIL}" \
            commit -m "kerbo ${VERSION}"
          git -C "${tap_dir}" push

  crates-io:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publicar en crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::notice::Sin el secreto CARGO_REGISTRY_TOKEN no se publica en crates.io"
            exit 0
          fi
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal
          cargo publish --locked
