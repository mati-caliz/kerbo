# Reglas de kerbo que gitleaks no trae, con el mismo formato que su configuración. La paridad con
# gitleaks se mide sin ellas.

[[rules]]
id = "connection-string-password"
regex = '''(?i)\b(?:jdbc:)?(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|mssql|sqlserver|oracle|clickhouse|cockroachdb|s?ftp|smtps?|ldaps?)://[^\s:/@'"\x60<>]{1,64}:([^\s:/@'"\x60<>]{3,128})@[\w.-]+'''
entropy = 3
keywords = ["://"]
[[rules.allowlists]]
regexes = [
    '''(?i)^(?:\$\{?[\w.:-]+\}?|\$\([\w.:-]+\)|\{\{[^}]*\}\}|<[^>]*>|%[\w()]+%?|\[[^\]]*\]|[*x.#_-]+)$''',
    '''(?i)^(?:pass(?:word|wd)?|pwd|pw|secret|changeme|change_me|example|sample|test(?:ing)?|dummy|redacted|placeholder|none|null|your[_-]?password)\d*$''',
]
