[package]
name = "kerbo"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
description = "Analizador de calidad multi-lenguaje: un binario, una configuración y un reporte"
license = "Apache-2.0"
repository = "https://github.com/mati-caliz/kerbo"
homepage = "https://kerbo.matiascaliz.com.ar"
readme = "README.md"
keywords = ["linter", "static-analysis", "complexity", "code-quality"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src", "/tests", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
aho-corasick = "1.1.5"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
miniz_oxide = "0.8.9"
lz4_flex = { version = "0.14.0", default-features = false, features = ["checked-decode", "safe-decode", "safe-encode", "std"] }
ignore = "0.4.33"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-ident = "1.0.27"

[profile.release]
codegen-units = 1
lto = true
strip = true
